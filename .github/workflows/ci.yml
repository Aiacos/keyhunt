name: CI

on:
  push:
    branches:
      - main
      - refactor-pipeline
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  build-and-test:
    name: Build and Test
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, ubuntu-22.04]
        compiler: [gcc]
        include:
          - os: ubuntu-latest
            compiler: gcc
            cc: gcc
            cxx: g++
          - os: ubuntu-22.04
            compiler: gcc
            cc: gcc
            cxx: g++

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential

      - name: Cache object files
        uses: actions/cache@v4
        with:
          path: obj/
          key: ${{ runner.os }}-${{ matrix.compiler }}-obj-${{ hashFiles('src/**/*.cpp', 'src/**/*.c', 'src/**/*.h', 'Makefile') }}
          restore-keys: |
            ${{ runner.os }}-${{ matrix.compiler }}-obj-

      - name: Build keyhunt
        env:
          CC: ${{ matrix.cc }}
          CXX: ${{ matrix.cxx }}
        run: |
          # Use -march=x86-64 for CI compatibility (no native optimizations)
          make -j$(nproc) COMMON_FLAGS="-m64 -march=x86-64 -mtune=generic -mssse3"

      - name: Verify binary exists
        run: |
          test -f keyhunt
          # Use timeout and skip sysinfo to avoid hanging on GPU detection in CI
          timeout 10 ./keyhunt -h 2>&1 | head -20 || echo "Help output timed out (expected in CI without GPU)"

      - name: Build test runner
        env:
          CC: ${{ matrix.cc }}
          CXX: ${{ matrix.cxx }}
        run: |
          make run_tests COMMON_FLAGS="-m64 -march=x86-64 -mtune=generic -mssse3"

      - name: Run tests
        id: tests
        timeout-minutes: 5
        run: |
          timeout 240 ./run_tests 2>&1 | tee test_output.txt || true
          echo "test_exit_code=${PIPESTATUS[0]}" >> $GITHUB_OUTPUT

      - name: Quick functionality test
        timeout-minutes: 2
        run: |
          # Test address mode with a small range (with timeout to prevent CI hang)
          timeout 30 ./keyhunt -m address -f tests/1to32.txt -r 1:FFFF -q -s 1 &
          PID=$!
          sleep 5
          kill $PID 2>/dev/null || true
          echo "Functionality test completed"

      - name: Upload test results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results-${{ matrix.os }}-${{ matrix.compiler }}
          path: |
            test_output.txt
          retention-days: 7

  build-with-tls:
    name: Build with TLS Support
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential libssl-dev

      - name: Cache object files
        uses: actions/cache@v4
        with:
          path: obj/
          key: ${{ runner.os }}-tls-obj-${{ hashFiles('src/**/*.cpp', 'src/**/*.c', 'src/**/*.h', 'Makefile') }}
          restore-keys: |
            ${{ runner.os }}-tls-obj-

      - name: Build with TLS enabled
        run: |
          make clean
          make ENABLE_TLS=1 -j$(nproc) COMMON_FLAGS="-m64 -march=x86-64 -mtune=generic -mssse3"

      - name: Verify TLS build
        run: |
          test -f keyhunt
          # Verify the binary was built with OpenSSL by checking linked libraries
          ldd keyhunt | grep -E "(libssl|libcrypto)" && echo "TLS support verified" || echo "Warning: TLS libraries not linked"
          ./keyhunt -h | head -20

  build-legacy:
    name: Build Legacy Version
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential libssl-dev libgmp-dev

      - name: Cache object files
        uses: actions/cache@v4
        with:
          path: obj/
          key: ${{ runner.os }}-legacy-obj-${{ hashFiles('src/**/*.cpp', 'src/**/*.c', 'src/**/*.h', 'Makefile') }}
          restore-keys: |
            ${{ runner.os }}-legacy-obj-

      - name: Build legacy version
        run: |
          make clean
          make legacy -j$(nproc) COMMON_FLAGS="-m64 -march=x86-64 -mtune=generic -mssse3"

      - name: Verify legacy binary exists
        run: |
          test -f keyhunt_legacy
          ./keyhunt_legacy -h | head -20

  static-analysis:
    name: Static Analysis
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install cppcheck
        run: |
          sudo apt-get update
          sudo apt-get install -y cppcheck

      - name: Run cppcheck
        continue-on-error: true
        run: |
          cppcheck \
            --enable=warning,style,performance,portability \
            --suppress=missingIncludeSystem \
            --suppress=unusedFunction \
            --suppress=unmatchedSuppression \
            --suppress=internalAstError \
            --error-exitcode=0 \
            --inline-suppr \
            --quiet \
            --std=c++17 \
            -I src/ \
            src/ 2>&1 | tee cppcheck_output.txt

      - name: Count warnings
        run: |
          WARN_COUNT=$(grep -c "^\[" cppcheck_output.txt || echo "0")
          echo "Static analysis found $WARN_COUNT warnings/issues"
          if [ "$WARN_COUNT" -gt 50 ]; then
            echo "::warning::High number of static analysis warnings: $WARN_COUNT"
          fi

      - name: Upload analysis results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: static-analysis-results
          path: cppcheck_output.txt
          retention-days: 7

  check-formatting:
    name: Check Code Style
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Check for common issues
        run: |
          # Check for trailing whitespace in source files
          echo "Checking for trailing whitespace..."
          find src/ -type f \( -name "*.cpp" -o -name "*.c" -o -name "*.h" \) -exec grep -l " $" {} \; > trailing_ws.txt || true
          if [ -s trailing_ws.txt ]; then
            echo "::warning::Files with trailing whitespace:"
            cat trailing_ws.txt
          fi

          # Check for tabs vs spaces consistency (informational only)
          echo "Checking indentation style..."
          TABS=$(find src/ -type f \( -name "*.cpp" -o -name "*.c" -o -name "*.h" \) -exec grep -l "	" {} \; | wc -l)
          SPACES=$(find src/ -type f \( -name "*.cpp" -o -name "*.c" -o -name "*.h" \) -exec grep -l "^    " {} \; | wc -l)
          echo "Files using tabs: $TABS, Files using spaces: $SPACES"

  summary:
    name: CI Summary
    runs-on: ubuntu-latest
    needs: [build-and-test, build-with-tls, build-legacy, static-analysis]
    if: always()

    steps:
      - name: Check job results
        run: |
          echo "## CI Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Job | Status |" >> $GITHUB_STEP_SUMMARY
          echo "|-----|--------|" >> $GITHUB_STEP_SUMMARY
          echo "| Build and Test | ${{ needs.build-and-test.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Build with TLS | ${{ needs.build-with-tls.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Build Legacy | ${{ needs.build-legacy.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Static Analysis | ${{ needs.static-analysis.result }} |" >> $GITHUB_STEP_SUMMARY

      - name: Fail if critical jobs failed
        if: needs.build-and-test.result == 'failure'
        run: exit 1
