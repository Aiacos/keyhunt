name: CI

on:
  push:
    branches:
      - main
      - refactor-pipeline
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  build-and-test:
    name: Build and Test
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, ubuntu-22.04]
        compiler: [gcc]
        include:
          - os: ubuntu-latest
            compiler: gcc
            cc: gcc
            cxx: g++
          - os: ubuntu-22.04
            compiler: gcc
            cc: gcc
            cxx: g++

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential

      - name: Cache object files
        uses: actions/cache@v4
        with:
          path: obj/
          key: ${{ runner.os }}-${{ matrix.compiler }}-obj-${{ hashFiles('src/**/*.cpp', 'src/**/*.c', 'src/**/*.h', 'Makefile') }}
          restore-keys: |
            ${{ runner.os }}-${{ matrix.compiler }}-obj-

      - name: Build keyhunt
        env:
          CC: ${{ matrix.cc }}
          CXX: ${{ matrix.cxx }}
        run: |
          # Use -march=x86-64 for CI compatibility (no native optimizations)
          make -j$(nproc) COMMON_FLAGS="-m64 -march=x86-64 -mtune=generic -mssse3"

      - name: Verify binary exists
        run: |
          test -f keyhunt
          # Use timeout and skip sysinfo to avoid hanging on GPU detection in CI
          timeout 10 ./keyhunt -h 2>&1 | head -20 || echo "Help output timed out (expected in CI without GPU)"

      - name: Build test runner
        env:
          CC: ${{ matrix.cc }}
          CXX: ${{ matrix.cxx }}
        run: |
          make run_tests COMMON_FLAGS="-m64 -march=x86-64 -mtune=generic -mssse3"

      - name: Run tests
        id: tests
        timeout-minutes: 5
        run: |
          timeout 240 ./run_tests 2>&1 | tee test_output.txt || true
          echo "test_exit_code=${PIPESTATUS[0]}" >> $GITHUB_OUTPUT

      - name: Quick functionality test
        timeout-minutes: 2
        run: |
          # Test address mode with a small range (with timeout to prevent CI hang)
          timeout 30 ./keyhunt -m address -f tests/1to32.txt -r 1:FFFF -q -s 1 &
          PID=$!
          sleep 5
          kill $PID 2>/dev/null || true
          echo "Functionality test completed"

      - name: Upload test results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results-${{ matrix.os }}-${{ matrix.compiler }}
          path: |
            test_output.txt
          retention-days: 7

  build-with-tls:
    name: Build with TLS Support
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential libssl-dev

      - name: Cache object files
        uses: actions/cache@v4
        with:
          path: obj/
          key: ${{ runner.os }}-tls-obj-${{ hashFiles('src/**/*.cpp', 'src/**/*.c', 'src/**/*.h', 'Makefile') }}
          restore-keys: |
            ${{ runner.os }}-tls-obj-

      - name: Build with TLS enabled
        run: |
          make clean
          make ENABLE_TLS=1 -j$(nproc) COMMON_FLAGS="-m64 -march=x86-64 -mtune=generic -mssse3"

      - name: Verify TLS build
        run: |
          test -f keyhunt
          # Verify the binary was built with OpenSSL by checking linked libraries
          ldd keyhunt | grep -E "(libssl|libcrypto)" && echo "TLS support verified" || echo "Warning: TLS libraries not linked"
          ./keyhunt -h | head -20

  build-legacy:
    name: Build Legacy Version
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential libssl-dev libgmp-dev

      - name: Cache object files
        uses: actions/cache@v4
        with:
          path: obj/
          key: ${{ runner.os }}-legacy-obj-${{ hashFiles('src/**/*.cpp', 'src/**/*.c', 'src/**/*.h', 'Makefile') }}
          restore-keys: |
            ${{ runner.os }}-legacy-obj-

      - name: Build legacy version
        run: |
          make clean
          make legacy -j$(nproc) COMMON_FLAGS="-m64 -march=x86-64 -mtune=generic -mssse3"

      - name: Verify legacy binary exists
        run: |
          test -f keyhunt_legacy
          ./keyhunt_legacy -h | head -20

  static-analysis:
    name: Static Analysis
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install cppcheck
        run: |
          sudo apt-get update
          sudo apt-get install -y cppcheck

      - name: Run cppcheck
        continue-on-error: true
        run: |
          cppcheck \
            --enable=warning,style,performance,portability \
            --suppress=missingIncludeSystem \
            --suppress=unusedFunction \
            --suppress=unmatchedSuppression \
            --suppress=internalAstError \
            --error-exitcode=0 \
            --inline-suppr \
            --quiet \
            --std=c++17 \
            -I src/ \
            src/ 2>&1 | tee cppcheck_output.txt

      - name: Count warnings
        run: |
          WARN_COUNT=$(grep -c "^\[" cppcheck_output.txt || echo "0")
          echo "Static analysis found $WARN_COUNT warnings/issues"
          if [ "$WARN_COUNT" -gt 50 ]; then
            echo "::warning::High number of static analysis warnings: $WARN_COUNT"
          fi

      - name: Upload analysis results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: static-analysis-results
          path: cppcheck_output.txt
          retention-days: 7

  address-sanitizer:
    name: AddressSanitizer
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential

      - name: Build with AddressSanitizer
        env:
          CC: gcc
          CXX: g++
        run: |
          # Build test runner with ASAN (without running tests)
          mkdir -p obj_asan
          make run_tests_asan OBJDIR=obj_asan \
            COMMON_FLAGS="-m64 -march=x86-64 -mtune=generic -mssse3" \
            CXXFLAGS="-m64 -march=x86-64 -mtune=generic -mssse3 -Wall -Wextra -Wno-deprecated-copy -std=gnu++17 -fno-exceptions -Isrc -fsanitize=address -fsanitize=undefined -fno-omit-frame-pointer -g -O1" \
            CFLAGS="-m64 -march=x86-64 -mtune=generic -mssse3 -Wall -Wextra -Wno-unused-parameter -Wno-unused-result -Isrc -fsanitize=address -fsanitize=undefined -fno-omit-frame-pointer -g -O1" \
            LDFLAGS="-m64 -march=x86-64 -mtune=generic -mssse3 -fsanitize=address -fsanitize=undefined -Wl,--as-needed" \
            LTO_FLAGS="" \
            GPU_CXXFLAGS="" \
            GPU_OBJS="obj_asan/gpu/gpu_backend_none.o obj_asan/gpu/multi_gpu_scheduler.o obj_asan/gpu/gpu_multi_worker.o obj_asan/gpu/async_pipeline.o obj_asan/gpu/gpu_dispatch.o"

      - name: Run tests with AddressSanitizer
        timeout-minutes: 10
        run: |
          export ASAN_OPTIONS="detect_leaks=1:abort_on_error=1:print_stats=1:halt_on_error=1"
          ./run_tests_asan 2>&1 | tee asan_output.txt
          exit_code=${PIPESTATUS[0]}
          if [ $exit_code -ne 0 ]; then
            echo "::error::AddressSanitizer detected memory errors!"
            exit $exit_code
          fi

      - name: Upload ASAN results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: asan-results
          path: asan_output.txt
          retention-days: 7

  thread-sanitizer:
    name: ThreadSanitizer
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential

      - name: Build with ThreadSanitizer
        env:
          CC: gcc
          CXX: g++
        run: |
          # Build test runner with TSAN (without running tests)
          mkdir -p obj_tsan
          make run_tests_tsan OBJDIR=obj_tsan \
            COMMON_FLAGS="-m64 -march=x86-64 -mtune=generic -mssse3" \
            CXXFLAGS="-m64 -march=x86-64 -mtune=generic -mssse3 -Wall -Wextra -Wno-deprecated-copy -std=gnu++17 -fno-exceptions -Isrc -fsanitize=thread -fno-omit-frame-pointer -g -O1" \
            CFLAGS="-m64 -march=x86-64 -mtune=generic -mssse3 -Wall -Wextra -Wno-unused-parameter -Wno-unused-result -Isrc -fsanitize=thread -fno-omit-frame-pointer -g -O1" \
            LDFLAGS="-m64 -march=x86-64 -mtune=generic -mssse3 -fsanitize=thread -Wl,--as-needed" \
            LTO_FLAGS="" \
            GPU_CXXFLAGS="" \
            GPU_OBJS="obj_tsan/gpu/gpu_backend_none.o obj_tsan/gpu/multi_gpu_scheduler.o obj_tsan/gpu/gpu_multi_worker.o obj_tsan/gpu/async_pipeline.o obj_tsan/gpu/gpu_dispatch.o"

      - name: Run tests with ThreadSanitizer
        timeout-minutes: 10
        run: |
          export TSAN_OPTIONS="halt_on_error=1:second_deadlock_stack=1"
          ./run_tests_tsan 2>&1 | tee tsan_output.txt
          exit_code=${PIPESTATUS[0]}
          if [ $exit_code -ne 0 ]; then
            echo "::error::ThreadSanitizer detected data races!"
            exit $exit_code
          fi

      - name: Upload TSAN results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: tsan-results
          path: tsan_output.txt
          retention-days: 7

  code-coverage:
    name: Code Coverage
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential lcov

      - name: Build with coverage instrumentation
        env:
          CC: gcc
          CXX: g++
        run: |
          mkdir -p obj_coverage
          make run_tests_cov OBJDIR=obj_coverage \
            COMMON_FLAGS="-m64 -march=x86-64 -mtune=generic -mssse3" \
            CXXFLAGS="-m64 -march=x86-64 -mtune=generic -mssse3 -Wall -Wextra -Wno-deprecated-copy -std=gnu++17 -fno-exceptions -Isrc --coverage -fprofile-arcs -ftest-coverage -g -O0" \
            CFLAGS="-m64 -march=x86-64 -mtune=generic -mssse3 -Wall -Wextra -Wno-unused-parameter -Wno-unused-result -Isrc --coverage -fprofile-arcs -ftest-coverage -g -O0" \
            LDFLAGS="-m64 -march=x86-64 -mtune=generic -mssse3 --coverage -Wl,--as-needed" \
            LTO_FLAGS="" \
            GPU_CXXFLAGS="" \
            GPU_OBJS="obj_coverage/gpu/gpu_backend_none.o obj_coverage/gpu/multi_gpu_scheduler.o obj_coverage/gpu/gpu_multi_worker.o obj_coverage/gpu/async_pipeline.o obj_coverage/gpu/gpu_dispatch.o"

      - name: Run tests for coverage
        timeout-minutes: 10
        run: |
          ./run_tests_cov

      - name: Generate coverage report
        run: |
          mkdir -p coverage
          # Capture coverage data
          lcov --capture --directory obj_coverage --output-file coverage/coverage.info --ignore-errors mismatch 2>/dev/null || \
            lcov --capture --directory obj_coverage --output-file coverage/coverage.info 2>/dev/null || \
            echo "lcov capture completed with warnings"
          # Filter out test files and system headers
          lcov --remove coverage/coverage.info '/usr/*' '*/tests/*' --output-file coverage/coverage.filtered.info 2>/dev/null || true
          # Generate summary
          lcov --summary coverage/coverage.filtered.info 2>/dev/null || true

      - name: Generate HTML report
        run: |
          genhtml coverage/coverage.filtered.info --output-directory coverage/html --title "Keyhunt Test Coverage" 2>/dev/null || \
            echo "genhtml completed with warnings"

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v4
        with:
          files: coverage/coverage.filtered.info
          flags: unittests
          name: keyhunt-coverage
          fail_ci_if_error: false
          verbose: true
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}

      - name: Upload coverage artifacts
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage-report
          path: |
            coverage/coverage.info
            coverage/coverage.filtered.info
            coverage/html/
          retention-days: 30

  check-formatting:
    name: Check Code Style
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Check for common issues
        run: |
          # Check for trailing whitespace in source files
          echo "Checking for trailing whitespace..."
          find src/ -type f \( -name "*.cpp" -o -name "*.c" -o -name "*.h" \) -exec grep -l " $" {} \; > trailing_ws.txt || true
          if [ -s trailing_ws.txt ]; then
            echo "::warning::Files with trailing whitespace:"
            cat trailing_ws.txt
          fi

          # Check for tabs vs spaces consistency (informational only)
          echo "Checking indentation style..."
          TABS=$(find src/ -type f \( -name "*.cpp" -o -name "*.c" -o -name "*.h" \) -exec grep -l "	" {} \; | wc -l)
          SPACES=$(find src/ -type f \( -name "*.cpp" -o -name "*.c" -o -name "*.h" \) -exec grep -l "^    " {} \; | wc -l)
          echo "Files using tabs: $TABS, Files using spaces: $SPACES"

  summary:
    name: CI Summary
    runs-on: ubuntu-latest
    needs: [build-and-test, build-with-tls, build-legacy, static-analysis, address-sanitizer, thread-sanitizer, code-coverage]
    if: always()

    steps:
      - name: Check job results
        run: |
          echo "## CI Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Job | Status |" >> $GITHUB_STEP_SUMMARY
          echo "|-----|--------|" >> $GITHUB_STEP_SUMMARY
          echo "| Build and Test | ${{ needs.build-and-test.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Build with TLS | ${{ needs.build-with-tls.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Build Legacy | ${{ needs.build-legacy.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Static Analysis | ${{ needs.static-analysis.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| AddressSanitizer | ${{ needs.address-sanitizer.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| ThreadSanitizer | ${{ needs.thread-sanitizer.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Code Coverage | ${{ needs.code-coverage.result }} |" >> $GITHUB_STEP_SUMMARY

      - name: Fail if critical jobs failed
        if: needs.build-and-test.result == 'failure' || needs.address-sanitizer.result == 'failure'
        run: exit 1
