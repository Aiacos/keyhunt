name: Windows CI

on:
  push:
    branches:
      - main
      - refactor-pipeline
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  build-mingw:
    name: Build Windows (MinGW-w64)
    runs-on: windows-latest
    timeout-minutes: 20

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup MinGW-w64
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: true
          install: >-
            mingw-w64-x86_64-gcc
            mingw-w64-x86_64-make
            make

      - name: Cache object files
        uses: actions/cache@v4
        with:
          path: obj/
          key: ${{ runner.os }}-mingw-obj-${{ hashFiles('src/**/*.cpp', 'src/**/*.c', 'src/**/*.h', 'Makefile') }}
          restore-keys: |
            ${{ runner.os }}-mingw-obj-

      - name: Build keyhunt for Windows
        shell: msys2 {0}
        run: |
          # Build with MinGW-w64 using generic x86-64 flags for compatibility
          make -j$(nproc) COMMON_FLAGS="-m64 -march=x86-64 -mtune=generic -mssse3"

      - name: Verify binary exists
        shell: msys2 {0}
        run: |
          test -f keyhunt.exe
          file keyhunt.exe
          # Display basic info (help may fail without proper terminal)
          ./keyhunt.exe -h 2>&1 | head -20 || echo "Help output not available in CI"

      - name: Build test runner
        shell: msys2 {0}
        run: |
          make run_tests COMMON_FLAGS="-m64 -march=x86-64 -mtune=generic -mssse3"

      - name: Run tests
        id: tests
        shell: msys2 {0}
        timeout-minutes: 5
        run: |
          ./run_tests.exe 2>&1 | tee test_output.txt
          exit_code=${PIPESTATUS[0]}
          echo "test_exit_code=$exit_code" >> $GITHUB_OUTPUT
          exit $exit_code

      - name: Upload test results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results-windows-mingw
          path: test_output.txt
          retention-days: 7

      - name: Upload Windows binary
        uses: actions/upload-artifact@v4
        with:
          name: keyhunt-windows-x64
          path: keyhunt.exe
          retention-days: 7

  build-cross-compile:
    name: Build Windows (Cross-compile from Linux)
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install MinGW-w64 cross-compiler
        run: |
          sudo apt-get update
          sudo apt-get install -y mingw-w64 g++-mingw-w64-x86-64 gcc-mingw-w64-x86-64

      - name: Cache object files
        uses: actions/cache@v4
        with:
          path: obj/
          key: ${{ runner.os }}-mingw-cross-obj-${{ hashFiles('src/**/*.cpp', 'src/**/*.c', 'src/**/*.h', 'Makefile') }}
          restore-keys: |
            ${{ runner.os }}-mingw-cross-obj-

      - name: Build Windows binary (cross-compile)
        run: |
          # Cross-compile for Windows from Linux
          make clean
          make -j$(nproc) \
            CXX=x86_64-w64-mingw32-g++ \
            CC=x86_64-w64-mingw32-gcc \
            COMMON_FLAGS="-m64 -march=x86-64 -mtune=generic -mssse3"

      - name: Verify binary exists
        run: |
          test -f keyhunt.exe
          file keyhunt.exe
          # Verify it's a Windows PE executable
          file keyhunt.exe | grep -q "PE32+ executable" && echo "✓ Valid Windows executable"

      - name: Build test runner (cross-compile)
        run: |
          make run_tests \
            CXX=x86_64-w64-mingw32-g++ \
            CC=x86_64-w64-mingw32-gcc \
            COMMON_FLAGS="-m64 -march=x86-64 -mtune=generic -mssse3"

      - name: Verify test runner binary
        run: |
          test -f run_tests.exe
          file run_tests.exe | grep -q "PE32+ executable" && echo "✓ Valid Windows test executable"

      - name: Upload Windows binary (cross-compiled)
        uses: actions/upload-artifact@v4
        with:
          name: keyhunt-windows-x64-cross
          path: |
            keyhunt.exe
            run_tests.exe
          retention-days: 7

  summary:
    name: Windows CI Summary
    runs-on: ubuntu-latest
    needs: [build-mingw, build-cross-compile]
    if: always()

    steps:
      - name: Check job results
        run: |
          echo "## Windows CI Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Job | Status |" >> $GITHUB_STEP_SUMMARY
          echo "|-----|--------|" >> $GITHUB_STEP_SUMMARY
          echo "| Build Windows (MinGW-w64) | ${{ needs.build-mingw.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Build Windows (Cross-compile) | ${{ needs.build-cross-compile.result }} |" >> $GITHUB_STEP_SUMMARY

      - name: Fail if critical jobs failed
        if: needs.build-mingw.result == 'failure'
        run: exit 1
